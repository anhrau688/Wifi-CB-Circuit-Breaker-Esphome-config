# Board: Generic - BK7238
# Definition: definitions/boards/generic-bk7238/manifest.yaml

esphome:
  name: aptomat-wifi
  friendly_name: aptomat_wifi
  on_boot:
    priority: -200
    then:
      - script.execute: apply_behavior      
      - if:
          condition:
            lambda: return id(light_mode).current_option() == "On";
          then:
            - output.turn_on: led  

bk72xx:
  board: generic-bk7238-tuya

logger:
  baud_rate: 0

api:
  encryption:
    key: "1uGLV6FucED0JaczM2bIqXdQbIOmyePIdEW3UTOm3o0="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: aptomat_wifi Fallback Hotspot
    password: "12345678"

captive_portal:
  
time:
  - platform: homeassistant
    id: ha_time  

#================ CPU CONFIGS ====================#  
text_sensor:
  - platform: uptime
    name: "Uptime"
    
  - platform: wifi_info
    ssid:
      name: "WiFi SSID"
      icon: mdi:wifi-sync

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      icon: mdi:ip-network-outline

  - platform: wifi_info
    bssid:
      name: "BSSID"  
      icon: mdi:wifi-marker

  - platform: wifi_info
    mac_address:
      name: "MAC"  
      icon: mdi:wifi-marker    

  - platform: template
    name: "Protection Status"
    id: protection_status
    icon: mdi:shield-check    
    update_interval: 1s
    lambda: |-
      if (isnan(id(voltage).state) && isnan(id(current).state))
        return {"No Data"};  
              
      if (!isnan(id(current).state) && isnan(id(voltage).state))
        return {"No Voltage Data"};  

      if (!isnan(id(voltage).state) && isnan(id(current).state))
        return {"No Current Data"};    

      if (id(voltage).state > id(over_voltage).state)
        return {"Over Voltage"};

      if (id(voltage).state < id(low_voltage).state)
        return {"Low Voltage"};

      if (id(current).state > id(over_load).state)
        return {"Over Load"};  

      return {"Safety"};      
      
#=================== UART ====================#
uart:
  id: uart_bl0942
  tx_pin: P11
  rx_pin: P10
  baud_rate: 4800
  stop_bits: 1

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
   
  - platform: internal_temperature  
    name: "CPU Temp"
    
  - platform: bl0942
    uart_id: uart_bl0942
    line_frequency: 50Hz
    reset: false

    voltage:
      name: "Voltage"
      id: voltage

    current:
      name: "Current"
      id: current

    power:
      name: "Load Power"
      id: power
      filters:
        - lambda: |-
            return x < 0.0f ? 0.0f : x;

    energy:
      name: "Total Energy"
      
    frequency:
      name: "Frequency"

  - platform: total_daily_energy
    name: "Today Energy"
    power_id: power
    unit_of_measurement: "kWh"
    filters: [ multiply: 0.001 ]   

button:
  - platform: restart
    name: "Restart"
    icon: mdi:restart
    
  - platform: factory_reset
    name: "Factory Reset (Eraser All Data)"     

#=================== Script ========================#
script:
  - id: relay_countdown_timer
    mode: restart
    then:
      - delay: !lambda |-
          return (uint32_t)(id(relay_countdown).state * 1000); 
      - if:
          condition:
            switch.is_on: relay
          then:
            - switch.turn_off: relay 

  - id: apply_behavior
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(power_on_behavior).current_option() == "Off";
          then:
            - switch.turn_off: relay

      - if:
          condition:
            lambda: return id(power_on_behavior).current_option() == "On";
          then:
            - switch.turn_on: relay

      - if:
          condition:
            lambda: return id(power_on_behavior).current_option() == "Restore";     
          then:
            - if:
                condition:
                  lambda: return id(relay_saved_state) == true;
                then:
                  - switch.turn_on: relay
                else:
                  - switch.turn_off: relay  
             
#================== Intervals ===================#
interval:
  - interval: 1s
    then:             
      # khi thông số vượt ngưỡng an toàn ngắt relay
      - if:
          condition:
            and:
              - switch.is_on: relay
              - lambda: |-
                  return id(voltage).state < id(low_voltage).state ||
                         id(voltage).state > id(over_voltage).state ||
                         id(current).state > id(over_load).state;
          then:
            - switch.turn_off: relay     

#================== GLOBALS ===================#
globals:
  - id: relay_state  #lấy trạng thái cho template switch 
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: relay_saved_state  # lưu trạng thái để restore
    type: bool
    restore_value: yes
    initial_value: 'false'   
    
#=================== GPIO ====================#  
status_led:
  pin:
    number: P15    #wifi
    inverted: false 
     
binary_sensor:
  - platform: gpio
    id: button_1
    pin:
      number: P17
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      then:
        - if:
            condition:
              switch.is_off: child_lock
            then:
              - switch.toggle: relay

output:
  - platform: gpio
    id: led
    pin:
      number: P21
      inverted: false   
      
  - platform: gpio
    id: relay_on
    pin:
      number: P8
      inverted: false

  - platform: gpio
    id: relay_off
    pin:
      number: P6
      inverted: false
      
#================ Template ==================== #
switch:
  - platform: template
    name: "Child Lock"
    id: child_lock
    icon: mdi:account-lock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  
  - platform: template
    name: "Relay"
    id: relay
    lambda: |-
      return id(relay_state);
      
    turn_on_action:
      - output.turn_off: relay_on
      - output.turn_off: relay_off
        
      - output.turn_on: relay_on
      - delay: 60ms
      - output.turn_off: relay_on
      - lambda: |-
          id(relay_state) = true;
          id(relay_saved_state) = true;
          
    turn_off_action:
      - output.turn_off: relay_on
      - output.turn_off: relay_off
        
      - output.turn_on: relay_off
      - delay: 60ms
      - output.turn_off: relay_off
      - lambda: |-
          id(relay_state) = false;
          id(relay_saved_state) = false;

    # sync đèn led với relay      
    on_state:
      then:
        - if:
            condition:
              lambda: return id(light_mode).current_option() == "On";
            then:
              - output.turn_on: led
            else:
              - if:
                  condition:
                    and:
                      - switch.is_on: relay
                      - lambda: return id(light_mode).current_option() == "Relay";
                  then:
                    - output.turn_on: led
                  else:
                    - output.turn_off: led    
                
    # chạy countdow khi cài đặt thời gian trong khi relay đang off          
    on_turn_on:
      - if:
          condition:
            lambda: return id(relay_countdown).state > 0; 
          then:
            - script.execute: relay_countdown_timer
    on_turn_off:
      - script.stop: relay_countdown_timer

select:
  - platform: template
    name: "Power On Behavior"
    id: power_on_behavior
    icon: mdi:history
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Restore"
      - "Off"
      - "On"
    initial_option: "Restore"   

  - platform: template
    name: "Light Mode"
    id: light_mode
    icon: mdi:lightbulb-on
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Relay"
      - "On"
      - "Off"
    initial_option: "Relay"
    on_value:
      then:
        - if:
            condition:
              lambda: return id(light_mode).current_option() == "On";
            then:
              - output.turn_on: led
            else:
              - if:
                  condition:
                    and:
                      - switch.is_on: relay
                      - lambda: return id(light_mode).current_option() == "Relay";
                  then:
                    - output.turn_on: led
                  else:
                    - output.turn_off: led

number:
  - platform: template
    name: "Countdown"
    id: relay_countdown
    icon: mdi:timer-sand
    entity_category: config
    optimistic: true
    restore_value: true
    mode: BOX
    unit_of_measurement: s 
    min_value: 0
    max_value: 3600
    step: 1
    set_action:
      - if:
          condition:
            switch.is_on: relay # chạy coundow khi đặt time trong khi switch đang on
          then:
            - if:
                condition:
                  lambda: return x > 0;
                then:
                  - delay: 100ms
                  - script.execute: relay_countdown_timer
                else:
                  - script.stop: relay_countdown_timer

  - platform: template
    name: "Low Voltage"
    id: low_voltage
    icon: mdi:flash-alert
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 85
    min_value: 50
    max_value: 200
    step: 1
    unit_of_measurement: "V"
    mode: BOX

  - platform: template
    name: "Over Voltage"
    id: over_voltage
    icon: mdi:flash-alert
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 265
    min_value: 220
    max_value: 300
    step: 1
    unit_of_measurement: "V"
    mode: BOX

  - platform: template
    name: "Over Load"
    id: over_load
    icon: mdi:current-ac
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 63
    min_value: 1
    max_value: 63
    step: 0.5
    unit_of_measurement: "A"
    mode: BOX                    
          
